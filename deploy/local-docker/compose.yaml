name: qm-local

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: qm-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - ../../data/mailpit:/data

  core:
    build:
      context: ../..
      dockerfile: deploy/local-docker/Dockerfile.core
    image: qm-core:local
    container_name: qm-core
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: "18080"
      DATA_DIR: /data
      PUBLIC_API_URL: http://host.docker.internal:18080
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8787}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_USERNAME: qm
      SMTP_PASSWORD: qm
      SMTP_TLS: none
      AUTH_EMAIL_TRANSPORT: smtp
      SANDBOX_BACKEND: local
      LOCAL_SANDBOX_IMAGE: qm-sandbox-local:latest
    volumes:
      - ../../data/core:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "964"

  web-ui:
    build:
      context: ../..
      dockerfile: deploy/local-docker/Dockerfile.web-ui
    image: qm-web-ui:local
    container_name: qm-web-ui
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: "8080"
      CORE_API_URL: http://host.docker.internal:18080
      WEB_UI_PUBLIC_URL: ${WEB_UI_PUBLIC_URL:-http://localhost:8787}
      WEB_UI_PRINCIPALS: admin@qm.local
    extra_hosts:
      - host.docker.internal:host-gateway

  portal:
    build:
      context: ../..
      dockerfile: deploy/local-docker/Dockerfile.portal
    image: qm-portal:local
    container_name: qm-portal
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      PORT: "8080"
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8787}
      CORE_API_URL: http://host.docker.internal:18080
      WEB_UI_UPSTREAM: http://web-ui:8080
      ADMIN_UPSTREAM: http://web-ui:8080/admin
      AUTH_EMBEDDED: "1"
      AUTH_BROKER_UPSTREAM: http://127.0.0.1:8099
      AUTH_BROKER_PREFIX: /idp
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8787/idp}
      OIDC_AUTH_ENDPOINT: ${OIDC_AUTH_ENDPOINT:-http://localhost:8787/idp/authorize}
      OIDC_TOKEN_ENDPOINT: http://127.0.0.1:8099/token
      OIDC_USERINFO_ENDPOINT: http://127.0.0.1:8099/userinfo
      OIDC_JWKS_URI: http://127.0.0.1:8099/.well-known/jwks.json
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8787/idp}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:8787/auth/callback}
      AUTH_EMAIL_TRANSPORT: smtp
      AUTH_EMAIL_FROM: qm@qm.local
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: qm
      SMTP_PASSWORD: qm
      SMTP_TLS: none
    ports:
      - "127.0.0.1:8787:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - web-ui
      - mailpit
